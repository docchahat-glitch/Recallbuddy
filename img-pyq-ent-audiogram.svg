<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect width="560" height="420" fill="#fff"/>
  <text x="300" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1B33">Pure-tone audiogram · Right ear</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#5B6780">Frequency (Hz)</text>
  <g font-size="11" fill="#0F1B33" text-anchor="middle">
    <text x="100" y="62">250</text><text x="180" y="62">500</text><text x="260" y="62">1000</text><text x="340" y="62">2000</text><text x="420" y="62">4000</text><text x="500" y="62">8000</text>
  </g>
  <text x="22" y="230" font-size="11" fill="#5B6780" transform="rotate(-90 22 230)" text-anchor="middle">Hearing level (dB HL)</text>
  <g font-size="11" fill="#0F1B33" text-anchor="end">
    <text x="62" y="84">-10</text><text x="62" y="114">0</text><text x="62" y="144">10</text><text x="62" y="174">20</text><text x="62" y="204">30</text><text x="62" y="234">40</text><text x="62" y="264">50</text><text x="62" y="294">60</text><text x="62" y="324">70</text><text x="62" y="354">80</text><text x="62" y="384">90</text>
  </g>
  <g stroke="#E1E6EF" stroke-width="1">
    <line x1="70" y1="80" x2="530" y2="80"/><line x1="70" y1="110" x2="530" y2="110"/><line x1="70" y1="140" x2="530" y2="140"/><line x1="70" y1="170" x2="530" y2="170"/><line x1="70" y1="200" x2="530" y2="200"/><line x1="70" y1="230" x2="530" y2="230"/><line x1="70" y1="260" x2="530" y2="260"/><line x1="70" y1="290" x2="530" y2="290"/><line x1="70" y1="320" x2="530" y2="320"/><line x1="70" y1="350" x2="530" y2="350"/><line x1="70" y1="380" x2="530" y2="380"/>
    <line x1="100" y1="70" x2="100" y2="390"/><line x1="180" y1="70" x2="180" y2="390"/><line x1="260" y1="70" x2="260" y2="390"/><line x1="340" y1="70" x2="340" y2="390"/><line x1="420" y1="70" x2="420" y2="390"/><line x1="500" y1="70" x2="500" y2="390"/>
  </g>
  <rect x="70" y="70" width="460" height="320" fill="none" stroke="#94A3B8"/>
  <!-- bone conduction (right, '<' symbol): near normal with a dip at 2000 Hz -->
  <polyline points="100,140 180,155 260,170 340,200 420,155" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="none" stroke="#1D4ED8" stroke-width="2.4">
    <path d="M106 132 L94 140 L106 148"/><path d="M186 147 L174 155 L186 163"/><path d="M266 162 L254 170 L266 178"/><path d="M346 192 L334 200 L346 208"/><path d="M426 147 L414 155 L426 163"/>
  </g>
  <!-- air conduction (right, 'O' symbol) -->
  <polyline points="100,260 180,255 260,245 340,245 420,230 500,240" fill="none" stroke="#DC2626" stroke-width="2.4"/>
  <g fill="#fff" stroke="#DC2626" stroke-width="2.4">
    <circle cx="100" cy="260" r="7"/><circle cx="180" cy="255" r="7"/><circle cx="260" cy="245" r="7"/><circle cx="340" cy="245" r="7"/><circle cx="420" cy="230" r="7"/><circle cx="500" cy="240" r="7"/>
  </g>
  <g font-size="11" fill="#0F1B33">
    <circle cx="86" cy="406" r="5" fill="#fff" stroke="#DC2626" stroke-width="2"/><text x="96" y="410">Air conduction</text>
    <path d="M222 400 L214 406 L222 412" fill="none" stroke="#1D4ED8" stroke-width="2"/><text x="230" y="410">Bone conduction</text>
  </g>
</svg>
