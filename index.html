<script>/* Recall Buddy site loader: free demo for visitors; full app (decrypted with a key from the server) after activation */
(function(){var g=function(k){try{return JSON.parse(localStorage.getItem('im-'+k))}catch(e){return null}},s=function(k,v){try{if(v==null)localStorage.removeItem('im-'+k);else localStorage.setItem('im-'+k,JSON.stringify(v))}catch(e){}};
var l=g('lic'),o=g('owner-code'),code=(l&&l.code)||o||'',V='c74da8dca0';
function mark(ed){window.RB_EDITION=ed;if(g('ed')!==ed){['qb-prog','qb-run','daily','daily-wrong','last','gt-run'].forEach(function(k){s(k,null)});s('ed',ed)}}
function add(src){var x=document.createElement('script');x.src=src;x.onload=function(){if(src.indexOf('blob:')===0)URL.revokeObjectURL(src)};document.body.appendChild(x)}
function demo(msg){if(msg)s('lic-msg',msg);mark('demo');add('demo.js?v='+V)}
function b64(t){var b=atob(t),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function full(k){return fetch('full.enc?v='+V).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(buf){return crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(buf,0,12)},key,new Uint8Array(buf,12))})}).then(function(pt){mark('full');add(URL.createObjectURL(new Blob([pt],{type:'text/javascript'})))})}
if(!code){mark('demo');document.write('<script src="demo.js?v='+V+'"><\/script>');return}
fetch('/api/unlock',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:code,device:g('device')||''})})
.then(function(r){if(r.status>=500)throw 0;return r.json()}).then(function(j){
  if(j.ok){s('fk',{k:j.key,t:Date.now()});s('srv-blocked',null);return full(j.key).catch(function(){demo('Could not open the full app. Please reload.')})}
  s('fk',null);if(j.blocked)s('srv-blocked',1);if(l&&l.code===code)s('lic',null);else s('owner-code',null);demo(j.why);
}).catch(function(){var f=g('fk');if(f&&f.k&&Date.now()-f.t<7*864e5)full(f.k).catch(function(){demo('')});else demo('Connect to the internet to open your full access.')});
})();</script>
